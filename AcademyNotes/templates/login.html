<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loginStyle.css') }}">
</head>
<body>
    
    <main class="card" role="main" aria-labelledby="title">
        <h1 id="title">Inicio de sesión</h1>

        <form id="loginForm" method="post" action="/login" novalidate>
            <div>
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" autocomplete="username" required autofocus/>
            </div>

            <div>
                
                <label for="password">Contraseña</label>
                <div class="row">
                    <input id="password" name="password" type="password" autocomplete="current-password" required/>
                    <button type="button" class="toggle" id="togglePassword" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
                </div>
            </div>

            <div id="error" class="error" role="alert" style="display: none;"></div>

            <div style="margin-top: 6px;">
                <button class="button" type="submit">Iniciar sesión</button>
            </div>

            <p class="muted small">¿No tienes cuenta?</p>
        </form> 
    </main>
    <script src="{{ url_for('static', filename='js/loginJs.js') }}"></script>
</body>
</html>

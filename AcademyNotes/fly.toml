# Configuracion de Fly.io para el prototipo AcademyNotes.
# El nombre debe ser unico en todo Fly: cambialo si ya esta tomado.
app = 'academynotes-demo'

# mia (Miami) es la region estable mas cercana a Colombia. Fly tambien
# ofrece bog (Bogota) si prefieres probarla.
primary_region = 'mia'

[build]

[env]
  ACADEMYNOTES_DATA_DIR = '/data'
  ACADEMYNOTES_HTTPS = '1'

[http_service]
  internal_port = 8080
  force_https = true
  # La maquina se mantiene encendida: si se apagara por inactividad, un
  # profesor que vuelve a media tarde encontraria la demostracion reiniciada.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1

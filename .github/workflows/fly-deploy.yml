name: Pruebas y despliegue

# Cada cambio en main se prueba y, si pasa, se despliega en Fly.io.
# El despliegue solo ocurre si las pruebas pasan: quien esta dando
# retroalimentacion nunca deberia toparse con una demostracion rota.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: AcademyNotes

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AcademyNotes/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar la suite
        run: python -m pytest tests -q

  desplegar:
    name: Desplegar en Fly.io
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: true
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Mientras no exista el secreto FLY_API_TOKEN el despliegue se omite en
      # lugar de fallar: un build en rojo por configuracion pendiente solo
      # genera ruido en un repositorio que se va a mostrar.
      - name: Comprobar configuracion de Fly
        id: config
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN no esta configurado. Se omite el despliegue (ver README, seccion Despliegue)."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.config.outputs.listo == 'true'

      - name: Desplegar
        if: steps.config.outputs.listo == 'true'
        run: flyctl deploy --remote-only

name: Pruebas y despliegue

# Cada cambio en main y cada pull request ejecutan la suite completa.
# El despliegue solo ocurre si las pruebas pasan: quien esta dando
# retroalimentacion no deberia toparse con una demostracion rota.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimo indispensable: ningun job necesita escribir en el repositorio.
permissions:
  contents: read

defaults:
  run:
    working-directory: AcademyNotes

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AcademyNotes/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar la suite
        run: python -m pytest tests -q

  desplegar:
    name: Desplegar en Railway
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: railway-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Este job es la ALTERNATIVA al disparador nativo de Railway, no un
      # complemento: si Railway ya redespliega solo al detectar el push, no
      # configures RAILWAY_TOKEN o cada cambio se desplegaria dos veces.
      # Sin el secreto, el paso se omite con un aviso en lugar de fallar.
      #
      # Se comprueba solo SI EXISTE el secreto, sin exponer su valor.
      - name: Comprobar configuracion
        id: config
        env:
          TIENE_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          if [ "$TIENE_TOKEN" != "true" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RAILWAY_TOKEN no esta configurado. Se omite el despliegue: se asume que Railway redespliega por su cuenta."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      # Version fijada a proposito: `npm install` sin version instalaria lo que
      # sea la ultima publicacion en ese momento, y los scripts de postinstall
      # se ejecutan con permisos del job. Subir la version debe ser una
      # decision consciente, no algo que cambie solo entre dos despliegues.
      - name: Instalar Railway CLI
        if: steps.config.outputs.listo == 'true'
        run: npm install -g @railway/cli@5.43.1

      # El token vive unicamente en este paso, no en todo el job: el paso que
      # instala dependencias de terceros nunca lo tiene a la vista.
      - name: Desplegar
        if: steps.config.outputs.listo == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service academynotes-demo --detach
